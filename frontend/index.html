<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111311" />
    <title>AI Document Chatbot</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('docchat-theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      function showErr(m){var r=document.getElementById('root');if(r&&!r.children.length){r.innerHTML='<pre style="padding:24px;color:#ff7a8a;white-space:pre-wrap;font-family:monospace">'+m+'</pre>';}}
      window.addEventListener('error',function(e){showErr('Error: '+e.message)});
      window.addEventListener('unhandledrejection',function(e){showErr('Error: '+(e.reason&&e.reason.message||e.reason))});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
